{% extends "auth_base.html" %}
{% block title %}Sign In · Personal Project Manager{% endblock %}
{% block auth_subtitle %}Welcome back! Please sign in to your workspace.{% endblock %}

{% block content %}
<form method="post" action="{{ url_for('login') }}" class="auth-form" novalidate>
  <div class="form-group">
    <label for="identity">Username or Email <span class="required">*</span></label>
    <input type="text" id="identity" name="identity" required autofocus
           placeholder="e.g. admin or name@example.com"
           value="{{ identity or '' }}">
  </div>

  <div class="form-group">
    <div class="label-split">
      <label for="password">Password <span class="required">*</span></label>
      <a href="{{ url_for('forgot_password') }}" class="label-link">Forgot password?</a>
    </div>
    <input type="password" id="password" name="password" required placeholder="Enter your password">
  </div>

  <div class="form-actions auth-actions">
    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
  </div>

  <div class="auth-footer">
    <span>Don't have an account yet?</span>
    <a href="{{ url_for('register') }}" class="auth-link">Create an account</a>
  </div>
</form>
{% endblock %}
