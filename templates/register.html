{% extends "auth_base.html" %}
{% block title %}Register · Personal Project Manager{% endblock %}
{% block auth_subtitle %}Create your private project management workspace.{% endblock %}

{% block content %}
<form method="post" action="{{ url_for('register') }}" class="auth-form" novalidate>
  <div class="form-group">
    <label for="full_name">Full Name</label>
    <input type="text" id="full_name" name="full_name" maxlength="150" autofocus
           placeholder="e.g. John Doe"
           value="{{ form_data.full_name if form_data else '' }}">
  </div>

  <div class="form-group">
    <label for="username">Username <span class="required">*</span></label>
    <input type="text" id="username" name="username" maxlength="80" required
           placeholder="e.g. jdoe (letters, numbers, underscore)"
           value="{{ form_data.username if form_data else '' }}">
  </div>

  <div class="form-group">
    <label for="email">Email Address <span class="required">*</span></label>
    <input type="email" id="email" name="email" maxlength="150" required
           placeholder="e.g. jdoe@example.com"
           value="{{ form_data.email if form_data else '' }}">
  </div>

  <div class="form-group">
    <label for="password">Password <span class="required">*</span></label>
    <input type="password" id="password" name="password" required minlength="6"
           placeholder="At least 6 characters">
  </div>

  <div class="form-group">
    <label for="confirm_password">Confirm Password <span class="required">*</span></label>
    <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
           placeholder="Re-enter your password">
  </div>

  <div class="form-actions auth-actions">
    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
  </div>

  <div class="auth-footer">
    <span>Already have an account?</span>
    <a href="{{ url_for('login') }}" class="auth-link">Sign in here</a>
  </div>
</form>
{% endblock %}
