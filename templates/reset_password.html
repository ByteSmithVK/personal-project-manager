{% extends "auth_base.html" %}
{% block title %}Set New Password · Personal Project Manager{% endblock %}
{% block auth_subtitle %}Create a new password for {{ target_username or 'your account' }}.{% endblock %}

{% block content %}
<form method="post" action="{{ url_for('reset_password', token=token) }}" class="auth-form" novalidate>
  <div class="form-group">
    <label for="new_password">New Password <span class="required">*</span></label>
    <input type="password" id="new_password" name="new_password" required minlength="6" autofocus
           placeholder="Enter your new password">
  </div>

  <div class="form-group">
    <label for="confirm_password">Confirm New Password <span class="required">*</span></label>
    <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
           placeholder="Re-enter your new password">
  </div>

  <div class="form-actions auth-actions">
    <button type="submit" class="btn btn-primary btn-block">Save New Password</button>
  </div>

  <div class="auth-footer">
    <a href="{{ url_for('login') }}" class="auth-link">← Cancel & Return to Sign In</a>
  </div>
</form>
{% endblock %}
